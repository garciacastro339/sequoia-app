<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- Seguridad: solo se permite cargar código de esta misma página y hablar con Google -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Sequoia</title>
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sequoia">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de entrada: se muestra mientras no hay sesión de Google -->
  <section id="login" class="login" hidden>
    <div class="login-box">
      <img src="icons/icon-192.png" alt="" class="login-logo">
      <h1>Sequoia</h1>
      <p>Pedidos, agenda y dinero de la florería.</p>
      <button id="btn-login" class="btn">Entrar con Google</button>
      <p id="login-msg" class="login-msg"></p>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <header class="top">
      <div>
        <b id="top-title">Sequoia</b>
        <small id="top-sub"></small>
      </div>
      <button id="btn-ajustes" class="gear" aria-label="Ajustes">⚙</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="nav">
      <button data-tab="agenda"><i></i>Agenda</button>
      <button data-tab="dinero"><i></i>Dinero</button>
      <button data-tab="inicio" class="home-wrap"><span class="home">Inicio</span></button>
      <button data-tab="inventario"><i></i>Inventario</button>
      <button data-tab="precios"><i></i>Precios</button>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
